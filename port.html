* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #333;
    min-height: 100vh;
}

/* Header */
header {
    background: rgba(255, 255, 255, 0.95);
    padding: 25px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

header h1 {
    color: #6a3dad;
    font-size: 40px;
    letter-spacing: 2px;
}

/* Navigation */
nav {
    background-color: #2d1b4e;
    padding: 18px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    margin: 0 50px;
    padding: 10px 15px;
    border-radius: 8px;
    transition: 0.3s;
}

nav a:hover {
    background-color: #9b6dde;
    color: white;
}

/* About Section */
#about {
    width: 80%;
    max-width: 800px;
    margin: 40px auto;
    background-color: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
}

/* Profile Image */
.profile {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid #764ba2;
    padding: 5px;
    margin-bottom: 25px;
    transition: 0.4s;
}

.profile:hover {
    transform: scale(1.05);
    border-color: #667eea;
}

/* About Heading */
#about h2 {
    text-align: center;
    color: #6a3dad;
    font-size: 30px;
    margin-bottom: 15px;
}

#about h3 {
    text-align: center;
    color: #333;
    font-size: 24px;
    margin-bottom: 25px;
}

/* Details */
#about p {
    background-color: #f4efff;
    padding: 12px 18px;
    margin: 10px 0;
    border-left: 5px solid #764ba2;
    border-radius: 8px;
    font-size: 16px;
}

#about p b {
    color: #6a3dad;
    margin-right: 5px;
}

/* Mobile Responsive */
@media (max-width: 600px) {

    #about {
        width: 90%;
        padding: 20px;
    }

    nav a {
        display: block;
        margin: 10px;
    }

    .profile {
        width: 180px;
        height: 180px;
    }

    header h1 {
        font-size: 30px;
    }
}
